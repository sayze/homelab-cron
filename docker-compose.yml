x-shared-env: &shared-env
  HOST_ROOT: ${HOST_ROOT:-/host}
  ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
  ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-}
  NOMAD_TOKEN: ${NOMAD_TOKEN:-}
  DATABASE_URL: ${DATABASE_URL:-}
  DOCKER_SOCK: ${DOCKER_SOCK:-/var/run/docker.sock}

# Grants both containers the full Docker Engine API of the host running
# docker compose — root-equivalent access, same caveat as
# homelab-cron.nomad.hcl's volume mount. Only needed to exercise
# WebstackVersionCheck's Docker version check locally (directly, or via
# GET /job/webstack-version-check); comment out if you'd rather not
# expose it in dev.
x-shared-volumes: &shared-volumes
  - ${HOST_ROOT_HOST_PATH:-/}:${HOST_ROOT:-/host}:ro
  - ${DOCKER_SOCK_HOST_PATH:-/var/run/docker.sock}:${DOCKER_SOCK:-/var/run/docker.sock}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/api"]
    ports:
      - "${ADDR_HOST_PORT:-8080}:8080"
    environment:
      <<: *shared-env
      ADDR: ":8080"
    volumes: *shared-volumes

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/cron"]
    environment: *shared-env
    volumes: *shared-volumes
