name: Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: |
          go mod download
          go install github.com/mfridman/tparse@latest

      - name: Run unit tests
        run: make unit
